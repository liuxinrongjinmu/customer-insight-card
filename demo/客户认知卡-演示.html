async function sel(id){
  const c = S.customers.find(x => x.id === id);
  if (!c) return;
  // 从「今天要做的事」点进来时，视图要跟着回到这个客户
  if (S.view !== 'customer'){ S.view = 'customer'; el('navTodo').classList.remove('on'); }
  S.cur = c;
  S.today = S.as_of;
  S.actDelta = null;
  // 换客户时清掉上一条「已办」回执：那是上一个客户的事，留在这里只会让人
  // 以为当前客户也办掉了什么。
  if (S.doneRec && S.doneRec.view && S.doneRec.view.id !== id) S.doneRec = null;
  renderDoneBar();
  // 列表里存的可能已经被上一次拖拽改写过（视图是按某天算出来的），
  // 切回来必须先按默认基准日重算，否则会看到「10-24 的标题 + 11-06 的事实」。
  await setDate(S.as_of, true);
  snapshotBase();
  renderDelta();
}

/* ==========================================================================
   与后端说话
   ========================================================================== */
async function api(path, body){
  const opt = body === undefined ? {} : {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  };
  let res;
  try { res = await fetch(path, opt); }
  catch(e){ throw new Error('连不上本地服务端。是不是 demo/serve.py 已经退出了？'); }
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok) throw new Error((data && data.error) || ('服务端返回 ' + res.status));
  return data;
}

function setPill(text, kind){
  const p = el('pill');
  p.textContent = text;
  p.className = 'pill ' + (kind || 'ok');
}

function toast(msg, bad){
  const t = el('toast');
  t.textContent = msg;
  t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className = 'toast' + (bad ? ' bad' : ''); }, 3200);
}

// 「重置演示数据」这个按钮，服务端不一定开着（P2-3 起默认关闭）。
// 画之前先问 health —— 否则用户点下去只会看到一句「没有这个路径：/api/reset」，
// 而这看上去像是页面坏了，其实是那道闸在正常工作。
//
// 不隐藏、只置灰：藏起来会让人以为这个功能被删了。置灰加 title，说清怎么才能用。
function bindReset(h){
  const b = el('btnReset');
  if (!b) return;
  if (h && h.allow_reset) {
    b.classList.remove('off'); b.disabled = false; b.title = '';
  } else {
    b.classList.add('off'); b.disabled = true;
    b.title = '重置接口默认关闭。起服务时加 --allow-reset 才能用（一个能让数据消失的接口，默认必须是关的）';
  }
}

async function boot(){
  try {
    const h = await api('/api/health');
    S.health = h; S.as_of = h.as_of; S.type_cn = h.type_cn || {}; S.source_cn = h.source_cn || {};
    if (h.offline) setPill('离线回放 · 只用缓存', 'warn');
    else setPill('真实模型 · ' + h.model, 'ok');
    el('brandsub').textContent = `演示版 v0.2 · 数据截至 ${h.as_of}`;
    el('mouth').textContent = h.offline
      ? '离线模式：抽取只走缓存，不联网'
      : `后端已连上：${h.model}`;
    bindReset(h);

    const d = await api('/api/customers');
    S.customers = d.customers; S.as_of = d.as_of; S.today = d.as_of;
    S.type_cn = d.type_cn || S.type_cn;
    S.cur = S.customers[0] || null;
    renderList(); render(); refreshFoot();
    snapshotBase(); renderDelta();
    loadTodo();

    try {
      const s = await api('/api/samples');
      S.samples = s.samples || [];
    } catch(e){ S.samples = []; }
    buildPasteForm();
  } catch(e){
    setPill('未连接', 'warn');
    el('mouth').textContent = '连不上服务端';
    toast(e.message, true);
    el('panel').innerHTML = `<div class="empty">${esc(e.message)}<br><br>
      在项目根目录执行 <b>python3 demo/serve.py</b>，然后刷新本页。</div>`;
  }
}

/* ==========================================================================
   记一笔
   ========================================================================== */
async function handleFileUpload(input){
  const file = input.files[0];
  if (!file) return;
  const fname = file.name;
  el('pfilename').textContent = fname + ' …';
  const ext = fname.split('.').pop().toLowerCase();

  if (['txt','md','csv','log'].includes(ext)){
    // 纯文本直接读，不走服务端
    const text = await file.text();
    el('ptext').value = text;
    el('pfilename').textContent = `${fname} · ${text.length} 字`;
    return;
  }

  if (ext === 'docx'){
    // docx 走服务端提取文本
    const buf = await file.arrayBuffer();
    const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
    try {
      const r = await api('/api/upload', {filename: fname, data: b64});
      el('ptext').value = r.text;
      el('pfilename').textContent = `${fname} · 提取了 ${r.n_chars} 字`;
    } catch(e){
      el('pfilename').textContent = '提取失败：' + e.message;
    }
    return;
  }

  el('pfilename').textContent = `暂不支持 .${ext} 格式，请复制文本粘贴`;
  input.value = '';
}

function buildPasteForm(){
  el('pcust').innerHTML = '<option value="__new__">＋ 新建客户</option>'
    + S.customers.map(c => `<option value="${c.id}">${esc(c.name)}（${c.records.length} 条记录）</option>`).join('');
  el('ptype').innerHTML = Object.entries(S.source_cn)
    .map(([k,v]) => `<option value="${k}">${esc(v)}</option>`).join('');
  el('pdate').value = S.as_of || '';
  el('samples').innerHTML = S.samples.map((s,i) => `<button class="sample" data-i="${i}">
      <b>${esc(s.title)}</b><span>${esc(s.note)}</span></button>`).join('')
    || '<span class="hint" style="margin:0">没有示例，直接粘一段试试。</span>';
  el('samples').querySelectorAll('.sample').forEach(b => b.onclick = () => applySample(+b.dataset.i));
  el('pcust').onchange = () => syncNewName();
  syncNewName();
}

function syncNewName(){
  const isNew = el('pcust').value === '__new__';
  el('newnameWrap').style.display = isNew ? '' : 'none';
}

function applySample(i){

  el('ptext').value = s.text;

  el('ptype').value = s.source_type;

function openPaste(){
  el('mask2').classList.add('on');
  el('dialog').classList.add('on');
  // 每次打开都退回「填内容」这一步：上一轮的草稿引用的原文已经不在框里了，
  // 把它留在面板上，用户面对的是一份没有出处的勾选清单。
  S.draft = null; S.picked = null;
  showStep(1);
  setTimeout(()=>el('ptext').focus(), 60);
}
function closePaste(){
  el('mask2').classList.remove('on');
  el('dialog').classList.remove('on');
  el('pprog').innerHTML = '';
  el('psubmit').disabled = false;
  el('pcommit').disabled = false;
  S.draft = null; S.picked = null;
  showStep(1);
}

/* 两步走：① 填内容、抽出来看看 → ② 勾选、确认入库。
   底部按钮跟着换，是因为同一个「提交」按钮在两步里含义不同——
   第一步是「让我看看能抽出什么」（可撤销），第二步是「写进库」（不可撤销）。
   一个按钮两种含义，第二次点击时用户会以为还是前者。 */
function showStep(n){
  const one = n === 1;
  el('pform').style.display = one ? '' : 'none';
  el('pstep2').style.display = one ? 'none' : '';
  el('psubmit').style.display = one ? '' : 'none';
  el('pcancel').style.display = one ? '' : 'none';
  el('pdiscard').style.display = one ? 'none' : '';
  el('pback').style.display = one ? 'none' : '';
  el('dsub').textContent = one
    ? '系统先从这段文本里抽事实，抽完给你看，勾了才入库。走的是和评测同一条管道。'
    : '下面是抽出来的事实。默认全勾；取消勾选的几条不会进卡，原文照样整段保留。';
}

/* 草稿面板。一行只放三样东西：类型、陈述、原文片段。
   字段全不全由校验层负责，摊开会让人不看就全选，这一步就等于没有。 */
function renderDraft(){
  const d = S.draft;
  if (!d) return;
  if (!d.n_facts){
    el('dsum').innerHTML = '';
    el('dlist').innerHTML = `<div class="empty2"><b>这段文本抽不出可用事实</b>${
      esc(d.empty_hint || '原因未给出。')}</div>`;
    el('dhint').innerHTML = '';
    el('pcommit').style.display = 'none';
    return;
  }
  el('pcommit').style.display = '';
  el('dsum').innerHTML =
    `<span class="cnt">抽出 ${d.n_facts} 条</span>`
    + `<span class="tip">已选 <b id="dpickn">${S.picked.size}</b> 条</span>`
    + `<span style="flex:1"></span>`
    + `<button class="dall" onclick="pickAll(true)">全选</button>`
    + `<button class="dall" onclick="pickAll(false)">全不选</button>`;
  el('dlist').innerHTML = d.facts.map(f => {
    const on = S.picked.has(f.fact_id);
    // 「规则判出」这枚小标不是装饰：模型说的是「我读到了什么」，
    // 规则说的是「原文里就写着变化」。用户的信任成本不一样，
    // 混在一列里就等于替他把两者当成了一回事。
    const badge = f.by === 'rule'
      ? '<span class="tagrule" title="由规则从原文里判出，证据是下面那句原话">规则判出</span>'
      : '';
    return `<label class="drow${on ? '' : ' off'}" id="drow-${f.fact_id}">
      <input type="checkbox"${on ? ' checked' : ''}
             onchange="togglePick('${f.fact_id}', this.checked)">
      <span>
        <div class="dt"><span class="tagt">${esc(f.type_cn || f.fact_type)}</span>${badge}${esc(f.statement)}</div>
        ${f.span ? `<div class="dspan">「${esc(f.span)}」</div>` : ''}
        ${f.gist ? `<div class="dgist">${esc(f.gist)}</div>` : ''}
      </span>
    </label>`;
  }).join('');

  const bits = [];
  if (d.n_rejected) {
    bits.push(`另有 ${d.n_rejected} 条被校验拒收（${esc(rejectText(d.rejected_summary))}），本来就不会进卡。`);
  }
  if (d.n_signals) {
    bits.push(`其中 ${d.n_signals} 条风险信号是规则从原文里判出来的`
      + `${d.signal_note ? '：' + esc(d.signal_note) : '。'}`);
  }
  if (!S.picked.size) {
    bits.push('一条都没勾——这时候不必入库，按「整条丢弃」关掉，原文和事实都不会留下任何东西。');
  } else if (S.picked.size < d.n_facts) {
    bits.push(`没勾的 ${d.n_facts - S.picked.size} 条会随草稿一起消失，原文里那句话还在，以后重抽还能抽到。`);
  }
  el('dhint').innerHTML = bits.join('<br>');
  el('pcommit').textContent = `确认入库（${S.picked.size} 条）`;
  el('pcommit').disabled = S.picked.size === 0;
}

function togglePick(fid, on){
  const set = new Set(S.picked);
  if (on) set.add(fid); else set.delete(fid);
  S.picked = set;
  renderDraft();
}

function pickAll(v){
  S.picked = new Set(v ? (S.draft ? S.draft.facts.map(f => f.fact_id) : []) : []);
  renderDraft();
}

function backToPaste(){
  S.draft = null; S.picked = null;
  el('pprog').innerHTML = '';
  showStep(1);
}

/* 「整条丢弃」是零成本的：不调 /api/commit 就等于什么都没发生。
   不需要删除接口，也就不存在「删了一半留下孤儿数据」这种状态。 */
function discardDraft(){
  const n = S.draft ? S.draft.n_facts : 0;
  const draftId = S.draft ? S.draft.draft_id : '';
  S.draft = null; S.picked = null;
  closePaste();
  toast(`已丢弃${draftId ? '（' + draftId + '）' : ''}：这段文本没有入库，${n} 条事实一条都没留下。`);
}

function pasteBody(){
  const text = el('ptext').value.trim();
  if (!text){ toast('还没有粘内容。', true); return null; }
  const target = el('pcust').value;
  const name = (el('pnewname').value || '').trim();
  if (target === '__new__' && !name){ toast('给这个新客户起个名字。', true); return null; }
  const body = {
    text,
    doc_date: el('pdate').value || S.as_of,
    source_type: el('ptype').value || 'visit_note'
  };
  if (target === '__new__') body.customer_name = name;
  else body.customer_id = target;
  return body;
}

async function submitPaste(){
  if (S.busy) return;
  const body = pasteBody();
  if (!body) return;

  S.busy = true;
  el('psubmit').disabled = true;
  const t0 = Date.now();
  const tick = setInterval(() => {
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    const slow = (Date.now() - t0) > 10000;
    el('pprog').innerHTML = `<span class="spin"></span>抽取中 ${secs}s${slow ? '（模型还没返回，仍在等）' : ''}`;
    setPill(`抽取中 ${secs}s`, 'busy');
  }, 120);
  el('pprog').innerHTML = '<span class="spin"></span>调用模型中…';

  try {
    // 只抽不落库：这一趟走完，库里一条都没多。
    const r = await api('/api/draft', body);
    S.draft = r;
    S.picked = new Set((r.facts || []).map(f => f.fact_id));
    el('pprog').innerHTML = '';
    showStep(2);
    renderDraft();
    setPill(r.n_facts ? `草稿 ${r.draft_id}：抽出 ${r.n_facts} 条，待确认` : '这段文本抽不出事实', 'busy');
  } catch(e){
    toast(e.message, true);
    el('pprog').innerHTML = '';
    setPill('抽取失败', 'warn');
  } finally {
    clearInterval(tick);
    S.busy = false;
    el('psubmit').disabled = false;
  }
}

async function commitDraft(){
  if (S.busy || !S.draft) return;
  const keep = Array.from(S.picked);
  if (!keep.length){
    toast('一条都没勾。要么勾几条，要么按「整条丢弃」关掉。', true);
    return;
  }
  const draft = S.draft;
  S.busy = true;
  el('pcommit').disabled = true;
  el('pprog').innerHTML = '<span class="spin"></span>入库并重算认知卡…';
  try {
    const r = await api('/api/commit', {draft_id: draft.draft_id, keep});
    const prev = S.customers.find(c => c.id === r.customer.id);
    const merged = (prev ? prev.fact_data : []).concat(r.fact_data);

    el('pprog').innerHTML = '<span class="spin"></span>重算认知卡…';
    const a = await api('/api/analyze', {
      customer_id: r.customer.id, fact_data: merged, today: S.as_of
    });

    const cust = Object.assign({}, a.view, { fact_data: merged });
    const idx = S.customers.findIndex(c => c.id === cust.id);
    if (idx >= 0) S.customers[idx] = cust; else S.customers.push(cust);

    S.cur = cust;
    // 入库后回到默认基准日：否则会出现「按 11-06 算出来的事实」配
    // 「10-24 的基准日标签」，滑块位置和卡片内容对不上。
    S.today = S.as_of;
    S.lastAdded = r.fact_data.map(f => f.fact_id);
    S.tab = 'card';
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === 'card'));

    const srcLabel = r.source === 'live' ? '真实模型' : '离线回放·缓存';
    S.receipt = {
      n_facts: r.n_facts,
      n_rejected: r.n_rejected,
      n_confirm: cust.facts.filter(f => r.fact_data.some(d => d.fact_id === f.fid) && f.tier !== 'show').length,
      // 勾掉的条数必须说出来。不说，用户会以为系统只抽出了这么多。
      n_discarded: r.n_discarded || 0,
      empty_reason: '',
      empty_hint: '',
      secs: ((r.ms) / 1000).toFixed(1),
      src: srcLabel,
      model: r.source === 'live' ? (r.model || '') : '',
      offline: !!r.offline || r.source !== 'live',
      // 记录日期晚于基准日时，回执当场说清「为什么卡片上看不到」，
      // 不等用户对着 0 条发懵（实测 2026-10-25：抽出 12 条、卡片 0 条）。
      pending_note: (r.doc && r.doc.date && r.doc.date > S.as_of)
        ? `记录日期 ${r.doc.date} 晚于基准日 ${S.as_of}，这条记录连同入库的 ${r.n_facts} 条事实都在「等待录入」里——把基准日调到 ${r.doc.date} 或之后即可看到。`
        : ''
    };

    closePaste();
    S.actDelta = null;
    snapshotBase();
    renderList(); render(); renderReceipt(); renderDelta(); refreshFoot();
    flashNewFacts();
    setPill(`上次入库：${srcLabel} · ${S.receipt.secs}s`, S.receipt.offline ? 'warn' : 'ok');
    if (r.note) toast(r.note, true);
  } catch(e){
    toast(e.message, true);
    el('pprog').innerHTML = '';
    setPill('入库失败', 'warn');
    el('pcommit').disabled = false;
  } finally {
    S.busy = false;
  }
}

function flashNewFacts(){
  if (!S.lastAdded.length) return;
  const f = S.cur.facts.find(x => S.lastAdded.includes(x.fid));
  if (!f) return;
  setTimeout(() => jump(f.key), 120);
}

/* 基准日：拖动只改标签，停手 60ms 才发请求。
   analyze 一次不到 1 毫秒，但拖动会连发几十次，没必要。
   60ms 的另一个好处是「松手前不动」，视觉上不会闪。 */
el('dtslider').oninput = e => {
  const d = offsetToDate(+e.target.value);
  el('dtpicker').value = d;
  const off = +e.target.value;
  el('dtlabel').textContent = off === 0 ? `${d}（默认）`
    : (off > 0 ? `${d}（+${off} 天）` : `${d}（${off} 天）`);
  clearTimeout(S.pending);
  S.pending = setTimeout(() => setDate(d), 60);
};
el('dtpicker').onchange = e => setDate(e.target.value);
el('dtreset').onclick = () => setDate(S.as_of);

el('navTodo').onclick = () => {
  S.view = 'todo';
  el('navTodo').classList.add('on');
  document.querySelectorAll('.item').forEach(n => n.classList.remove('on'));
  loadTodo();
  render();
};
el('btnVisit').onclick = () => openBrief('visit');
el('btnProposal').onclick = () => openBrief('proposal');
el('btnHandover').onclick = () => openBrief('handover');
el('bclose').onclick = closeBrief;
el('bcopy').onclick = copyBrief;
el('bmask').onclick = closeBrief;

el('tabs').querySelectorAll('.tab').forEach(t => t.onclick = () => {
  S.tab = t.dataset.tab;
  el('tabs').querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  render();
});
el('btnReset').onclick = async () => {
  try {
    await api('/api/reset', {});
    S.receipt = null; S.lastAdded = []; S.baseView = null;
    await boot();
    renderReceipt();
    toast('已恢复到初始演示数据');
  } catch(e){ toast(e.message, true); }
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeRec(); closePaste(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && el('dialog').classList.contains('on')){
    // 第二步的回车是「入库」，第一步是「抽取」。跟着当前这一步走，
    // 否则在勾选面板上按回车会重新抽一遍，把刚勾的结果冲掉。
    S.draft ? commitDraft() : submitPaste();
  }
});

boot();
</script>
</body>
</html>
